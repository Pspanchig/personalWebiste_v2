<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Contact Me - Software Engineer Portfolio</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>    
</head>

<body
    class="bg-background-light dark:bg-background-dark font-sans text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
    <main class="max-w-6xl mx-auto px-6 pt-8">        
        <app-navbar></app-navbar>
        <div
            class="bg-white/5 rounded-3xl p-8 md:p-12 shadow-2xl dark:shadow-[0_0_50px_rgba(0,0,0,0.3)] border border-slate-200 dark:border-white/5 flex flex-col lg:flex-row gap-16 relative overflow-hidden">
            <div class="flex-1 flex flex-col justify-center">
                <h1 class="text-5xl text-start md:text-6xl font-bold mb-16 tracking-tight"> Contact me!</h1>
                <h2 class="text-2xl font-semibold mb-10 text-slate-800 dark:text-slate-200">You can also...</h2>
                <div class="space-y-10">
                    <div class="group flex items-center gap-6">
                        <div
                            class="w-16 h-16 rounded-full bg-slate-100 dark:bg-white/5 flex items-center justify-center border border-slate-200 dark:border-white/10 group-hover:border-primary/50 transition-colors">
                            <span class="material-symbols-outlined text-3xl">mail</span>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Email me directly at</p>
                            <a class="text-lg font-medium hover:text-primary transition-colors"
                                href="mailto:pspanchig@outlook.com">pspanchig@outlook.com</a>
                        </div>
                    </div>
                    <div class="group flex items-center gap-6">
                        <div
                            class="w-16 h-16 rounded-full bg-slate-100 dark:bg-white/5 flex items-center justify-center border border-slate-200 dark:border-white/10 group-hover:border-primary/50 transition-colors">
                            <span class="material-symbols-outlined text-3xl">call</span>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Call me directly at</p>
                            <p class="text-lg font-medium">(+593) 0998587329</p>
                        </div>
                    </div>
                    <div class="group flex items-center gap-6">
                        <div
                            class="w-16 h-16 rounded-full bg-slate-100 dark:bg-white/30 flex items-center justify-center border border-slate-200 dark:border-white/10 group-hover:border-primary/50 transition-colors">
                            <span class="material-symbols-outlined text-3xl">chat</span>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">Text me directly at</p>
                            <a class="text-lg font-medium text-blue-500 hover:text-blue-400 transition-colors"
                                href="https://wa.me/5930998587329">(+593) 0998587329</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex-1 text-slate-950">
                <div
                    class="bg-red-700 dark:bg-black/20 rounded-2xl p-8 border border-slate-200 dark:border-white/5 relative">
                    <div
                        class="absolute top-0 left-40 max-w-1/2 text-center bg-primary text-black px-8 py-2 rounded-full font-bold text-sm tracking-wider uppercase shadow-lg shadow-primary/30">
                        Email me!
                    </div>
                    <form class="mt-8 space-y-6">
                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Your
                                Email</label>
                            <input
                                class="text-slate-950 w-full px-5 py-4 rounded-xl bg-white dark:glass-input border-slate-300 dark:border-white/10  dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 transition-all"
                                placeholder="Type your email here..." type="email" />
                        </div>
                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Your
                                Name</label>
                            <input
                                class="w-full px-5 py-4 rounded-xl bg-white dark:glass-input border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 transition-all"
                                placeholder="Type your name here..." type="text" />
                        </div>
                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Subject</label>
                            <input
                                class="w-full px-5 py-4 rounded-xl bg-white dark:glass-input border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 transition-all"
                                placeholder="Type your subject here..." type="text" />
                        </div>
                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2 ml-1">Message</label>
                            <textarea
                                class="w-full px-5 py-4 rounded-xl bg-white dark:glass-input border-slate-300 dark:border-white/10 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:ring-2 focus:ring-primary/50 transition-all resize-none"
                                placeholder="Type your message here..." rows="4"></textarea>
                        </div>
                        <button
                            class="w-full bg-amber-400 hover:bg-primary/90 text-black font-bold py-4 rounded-xl glow-button transition-all duration-300 uppercase tracking-widest mt-4"
                            type="submit">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    <div class="mt-12 flex items-center justify-center mb-8 text-xs text-gray-600 font-mono tracking-wide opacity-60">
        © 2026 PABLO S. PANCHIG. ALL RIGHTS RESERVED.
    </div>
    </main>
</body>

</html>
