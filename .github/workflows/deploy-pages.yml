name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist/personalWebiste_v2/site/app
          cp -r dist/personalWebiste_v2/browser/. dist/personalWebiste_v2/site/app/
          cp dist/personalWebiste_v2/browser/CNAME dist/personalWebiste_v2/site/CNAME
          cp dist/personalWebiste_v2/browser/404.html dist/personalWebiste_v2/site/404.html
          cat <<'EOF' > dist/personalWebiste_v2/site/index.html
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0; url=/app/">
            <script>
              location.replace('/app/');
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/personalWebiste_v2/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
